name: EV Charger Alert Scheduler

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  check-charger-alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for available chargers
        run: |
          echo "Checking EV charger status at $(date)"
          response=$(curl -s -w "HTTP_STATUS:%{http_code}" "https://evc-alert-app.streamlit.app/?api=check_alert")
          http_status=$(echo "$response" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          body=$(echo "$response" | sed 's/HTTP_STATUS:[0-9]*$//')
          
          echo "Response: $body"
          echo "HTTP Status: $http_status"
          
          if [ "$http_status" -ne 200 ]; then
            echo "Error: API returned status $http_status"
            exit 1
          fi